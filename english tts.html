<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronunciation App</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 230px;
            padding: 18px;
            resize: vertical;
            border: 2px solid #ddd;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
            outline: none;
        }

        textarea:focus {
            border-color: #4d8cff;
        }

        .section-title {
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .language-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .american {
            background: #e5efff;
            color: #1859b5;
        }

        .british {
            background: #eee7ff;
            color: #6238b5;
        }

        .korean {

            gap: 10px;

        }

        .stop {
            background: #ffe5e5;
            color: #c62828;
        }

        .clear {
            background: #eeeeee;
            color: #555;
        }

        .speed {
            margin-top: 25px;
        }

        .speed-row {
            display: flex;
            align-items: center;

        }

        #speed {
            flex: 1;

            width: 45px;
            font-weight: bold;

            margin-top: 25px;

            margin-top: 10px;

        @media (max-width: 600px) {

                margin: 20px;
                padding: 20px;

            .language-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🔊 Pronunciation App</h1>

    <div class="subtitle">
        텍스트를 입력하고 원하는 발음을 선택하세요.
    </div>


    <!-- 텍스트 입력 -->
    <textarea
        id="textInput"
        placeholder="영어 또는 한국어를 자유롭게 입력하세요.

예:
Hello, everyone.
Welcome to my English class.

안녕하세요. 오늘 수업에 오신 것을 환영합니다."
    ></textarea>


    <!-- 언어 선택 -->
    <div class="section-title">
        🎧 발음 선택
    </div>

    <div class="language-buttons">

        <button
            class="american"
            onclick="speak('en-US')">
            🇺🇸 American English
        </button>

        <button
            class="british"
            onclick="speak('en-GB')">
            🇬🇧 British English
        </button>

        <button
            class="korean"
            onclick="speak('ko-KR')">
            🇰🇷 한국어
        </button>

    </div>


    <!-- 정지 / 지우기 -->
    <div class="control-buttons">

        <button
            class="stop"
            onclick="stopSpeech()">
            ⏹ 정지
        </button>

        <button
            class="clear"
            onclick="clearText()">
            🗑 지우기
        </button>

    </div>


    <!-- 속도 -->
    <div class="speed">

        <div class="section-title">
            ⚙️ 말하기 속도
        </div>

        <div class="speed-row">

            <span>느림</span>

            <input
                type="range"
                id="speed"
                min="0.5"
                max="1.5"
                step="0.1"
                value="1"
                oninput="changeSpeed()"
            >

            <span>빠름</span>

            <span id="speedValue">1.0x</span>

        </div>

    </div>


    <!-- 상태 -->
    <div
        class="status"
        id="status">
        텍스트를 입력해주세요.
    </div>

    <div
        class="voice-info"
        id="voiceInfo">
        브라우저의 음성을 사용합니다.
    </div>

</div>


<script>

    // =====================================
    // 브라우저 음성 목록
    // =====================================

    let voices = [];


    function loadVoices() {
        voices = speechSynthesis.getVoices();
    }


    speechSynthesis.onvoiceschanged = loadVoices;

    loadVoices();


    // =====================================
    // 음성 찾기
    // =====================================

    function findVoice(language) {

        // 정확하게 일치하는 음성 찾기
        let exactVoice = voices.find(function(voice) {

            return voice.lang.toLowerCase() ===
                   language.toLowerCase();

        });


        if (exactVoice) {
            return exactVoice;
        }


        // 같은 언어의 음성 찾기
        let baseLanguage =
            language.split("-")[0].toLowerCase();


        return voices.find(function(voice) {

            return voice.lang
                .toLowerCase()
                .startsWith(baseLanguage);

        });
    }


    // =====================================
    // 텍스트 읽기
    // =====================================

    function speak(language) {

        const text =
            document
                .getElementById("textInput")
                .value
                .trim();


        // 텍스트가 없는 경우
        if (text === "") {

            alert("텍스트를 먼저 입력해주세요.");

            return;
        }


        // 현재 재생 중인 음성 정지
        speechSynthesis.cancel();


        // 음성 객체 생성
        const utterance =
            new SpeechSynthesisUtterance(text);


        // 언어 설정
        utterance.lang = language;


        // 해당 언어의 음성 찾기
        const voice = findVoice(language);


        if (voice) {

            utterance.voice = voice;

            document
                .getElementById("voiceInfo")
                .innerText =
                "사용 중인 음성: " +
                voice.name +
                " (" +
                voice.lang +
                ")";

        }


        else {

            document
                .getElementById("voiceInfo")
                .innerText =
                "해당 음성을 찾지 못했습니다. 브라우저 기본 음성을 사용합니다.";

        }


        // 속도
        utterance.rate =
            Number(
                document
                    .getElementById("speed")
                    .value
            );


        // 기본 음높이
        utterance.pitch = 1;


        // 기본 볼륨
        utterance.volume = 1;


        // =================================
        // 재생 시작
        // =================================

        utterance.onstart = function() {

            let message;


            if (language === "en-US") {

                message =
                    "🇺🇸 American English로 읽는 중...";

            }

            else if (language === "en-GB") {

                message =
                    "🇬🇧 British English로 읽는 중...";

            }

            else {

                message =
                    "🇰🇷 한국어로 읽는 중...";

            }


            document
                .getElementById("status")
                .innerText = message;

        };


        // =================================
        // 재생 완료
        // =================================

        utterance.onend = function() {

            document
                .getElementById("status")
                .innerText =
                "✅ 재생 완료";

        };


        // =================================
        // 오류
        // =================================

        utterance.onerror = function() {

            document
                .getElementById("status")
                .innerText =
                "❌ 음성 재생에 문제가 발생했습니다.";

        };


        // 음성 재생
        speechSynthesis.speak(utterance);
    }


    // =====================================
    // 정지
    // =====================================

    function stopSpeech() {

        speechSynthesis.cancel();

        document
            .getElementById("status")
            .innerText =
            "⏹ 재생 중지";
    }


    // =====================================
    // 텍스트 삭제
    // =====================================

    function clearText() {

        speechSynthesis.cancel();

        document
            .getElementById("textInput")
            .value = "";

        document
            .getElementById("status")
            .innerText =
            "텍스트를 입력해주세요.";
    }


    // =====================================
    // 속도 변경
    // =====================================

    function changeSpeed() {

        const speed =
            document
                .getElementById("speed")
                .value;


        document
            .getElementById("speedValue")
            .innerText =
            speed + "x";
    }

</script>

</body>
</html>
