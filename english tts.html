<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Text to Speech</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f2f5f9;
        margin: 0;
        padding: 40px 20px;
    }

    .app {
        max-width: 750px;
        margin: auto;
        background: white;
        padding: 30px;
        border-radius: 20px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 10px;
    }

    .description {
        text-align: center;
        color: #777;
        margin-bottom: 25px;
    }

    textarea {
        width: 100%;
        height: 220px;
        padding: 15px;
        box-sizing: border-box;

        font-size: 18px;
        line-height: 1.6;

        border: 2px solid #ddd;
        border-radius: 12px;

        resize: vertical;
        outline: none;
    }

    textarea:focus {
        border-color: #4d8cff;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 20px;
    }

    button {
        padding: 16px 10px;
        border: none;
        border-radius: 12px;

        font-size: 16px;
        font-weight: bold;

        cursor: pointer;
    }

    button:hover {
        opacity: 0.8;
    }

    .american {
        background: #e5efff;
        color: #1758b5;
    }

    .british {
        background: #eee7ff;
        color: #633bb5;
    }

    .korean {
        background: #e4f7e9;
        color: #218345;
    }

    .stop {
        background: #ffe5e5;
        color: #c62828;
        width: 100%;
        margin-top: 12px;
    }

    .clear {
        background: #eeeeee;
        color: #555;
        width: 100%;
        margin-top: 10px;
    }

    .speed {
        margin-top: 25px;
    }

    .speed-title {
        font-weight: bold;
        margin-bottom: 10px;
    }

    .speed-box {
        display: flex;
        align-items: center;
        gap: 12px;
    }

    #speed {
        flex: 1;
    }

    #speedValue {
        width: 45px;
        font-weight: bold;
    }

    .status {
        margin-top: 25px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 10px;
        text-align: center;
        color: #555;
    }

    @media (max-width: 600px) {
        .buttons {
            grid-template-columns: 1fr;
        }

        .app {
            padding: 20px;
        }
    }
</style>

</head>


<body>

<div class="app">

    <h1>🔊 Text to Speech</h1>

    <div class="description">
        텍스트를 입력하고 원하는 발음을 선택하세요.
    </div>


    <textarea
        id="text"
        placeholder="영어 또는 한국어를 입력하세요.

예:
Hello! How are you today?

안녕하세요! 오늘 기분이 어떠세요?"
    ></textarea>


    <div class="buttons">

        <button
            class="american"
            onclick="speak('en-US')">
            🇺🇸 American
        </button>

        <button
            class="british"
            onclick="speak('en-GB')">
            🇬🇧 British
        </button>

        <button
            class="korean"
            onclick="speak('ko-KR')">
            🇰🇷 Korean
        </button>

    </div>


    <button
        class="stop"
        onclick="stopSpeaking()">
        ⏹ 정지
    </button>


    <button
        class="clear"
        onclick="clearText()">
        🗑 텍스트 지우기
    </button>


    <div class="speed">

        <div class="speed-title">
            🔧 말하기 속도
        </div>

        <div class="speed-box">

            <span>느림</span>

            <input
                type="range"
                id="speed"
                min="0.5"
                max="1.5"
                step="0.1"
                value="1"
                oninput="changeSpeed()"
            >

            <span>빠름</span>

            <span id="speedValue">
                1.0x
            </span>

        </div>

    </div>


    <div
        class="status"
        id="status">
        텍스트를 입력해주세요.
    </div>

</div>


<script>

let voices = [];


/* ---------------------------
   브라우저 음성 목록 가져오기
---------------------------- */

function loadVoices() {

    voices = window.speechSynthesis.getVoices();

}

window.speechSynthesis.onvoiceschanged = loadVoices;

loadVoices();


/* ---------------------------
   원하는 음성 찾기
---------------------------- */

function findVoice(language) {

    // 정확한 언어 찾기
    let voice = voices.find(function(v) {

        return v.lang.toLowerCase() ===
               language.toLowerCase();

    });

    if (voice) {
        return voice;
    }


    // 같은 언어 찾기
    let baseLanguage =
        language.split("-")[0].toLowerCase();

    voice = voices.find(function(v) {

        return v.lang
            .toLowerCase()
            .startsWith(baseLanguage);

    });

    return voice;
}


/* ---------------------------
   텍스트 읽기
---------------------------- */

function speak(language) {

    let text =
        document.getElementById("text").value.trim();


    if (text === "") {

        alert("텍스트를 먼저 입력해주세요.");

        return;
    }


    // 기존 음성 정지
    window.speechSynthesis.cancel();


    // 새로운 음성 생성
    let speech =
        new SpeechSynthesisUtterance(text);


    // 언어 설정
    speech.lang = language;


    // 음성 찾기
    let voice = findVoice(language);


    if (voice) {

        speech.voice = voice;

    }


    // 속도
    speech.rate =
        Number(
            document.getElementById("speed").value
        );


    // 음높이
    speech.pitch = 1;


    // 볼륨
    speech.volume = 1;


    /* 상태 표시 */

    speech.onstart = function() {

        if (language === "en-US") {

            document.getElementById("status")
                .innerText =
                "🇺🇸 American English로 읽는 중...";

        }

        else if (language === "en-GB") {

            document.getElementById("status")
                .innerText =
                "🇬🇧 British English로 읽는 중...";

        }

        else {

            document.getElementById("status")
                .innerText =
                "🇰🇷 한국어로 읽는 중...";

        }

    };


    speech.onend = function() {

        document.getElementById("status")
            .innerText =
            "✅ 재생 완료";

    };


    speech.onerror = function() {

        document.getElementById("status")
            .innerText =
            "❌ 음성 재생에 문제가 발생했습니다.";

    };


    // 음성 재생
    window.speechSynthesis.speak(speech);

}


/* ---------------------------
   정지
---------------------------- */

function stopSpeaking() {

    window.speechSynthesis.cancel();

    document.getElementById("status")
        .innerText =
        "⏹ 재생 중지";

}


/* ---------------------------
   텍스트 지우기
---------------------------- */

function clearText() {

    window.speechSynthesis.cancel();

    document.getElementById("text").value = "";

    document.getElementById("status")
        .innerText =
        "텍스트를 입력해주세요.";

}


/* ---------------------------
   속도 변경
---------------------------- */

function changeSpeed() {

    let speed =
        document.getElementById("speed").value;

    document.getElementById("speedValue")
        .innerText =
        speed + "x";

}

</script>

</body>
</html>
