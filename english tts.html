<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Text to Speech</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f6fa;
            margin: 0;
            padding: 40px 20px;
        }

        .app {
            width: 90%;
            max-width: 750px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #777;
        }

        textarea {
            width: 100%;
            height: 220px;
            padding: 15px;
            box-sizing: border-box;
            font-size: 18px;
            border: 2px solid #ddd;
            border-radius: 12px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #4d8cff;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .american {
            background: #e3efff;
            color: #1758b5;
        }

        .british {
            background: #eee7ff;
            color: #6238b5;
        }

        .korean {
            background: #e4f7e9;
            color: #218345;
        }

        .stop {
            background: #ffe4e4;
            color: #c62828;
        }

        .clear {
            background: #eeeeee;
            color: #555;
        }

        .control {
            margin-top: 10px;
        }

        .speed {
            margin-top: 25px;
        }

        .speed-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        #speed {
            flex: 1;
        }

        #speedValue {
            width: 40px;
            font-weight: bold;
        }

        .status {
            margin-top: 25px;
            padding: 15px;
            text-align: center;
            background: #f5f5f5;
            border-radius: 10px;
        }

        @media (max-width: 600px) {
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <h1>🔊 Text to Speech</h1>

    <p>
        텍스트를 입력하고 원하는 발음을 선택하세요.
    </p>

    <textarea
        id="text"
        placeholder="영어 또는 한국어를 입력하세요.

예:
Hello, everyone!
Welcome to my English class.

안녕하세요! 반갑습니다."
    ></textarea>


    <!-- 발음 선택 -->

    <div class="buttons">

        <button
            class="american"
            onclick="readText('en-US')">
            🇺🇸 American
        </button>

        <button
            class="british"
            onclick="readText('en-GB')">
            🇬🇧 British
        </button>

        <button
            class="korean"
            onclick="readText('ko-KR')">
            🇰🇷 Korean
        </button>

    </div>


    <!-- 정지 -->

    <div class="buttons control">

        <button
            class="stop"
            onclick="stopText()">
            ⏹ Stop
        </button>

        <button
            class="clear"
            onclick="clearText()">
            🗑 Clear
        </button>

    </div>


    <!-- 속도 -->

    <div class="speed">

        <strong>말하기 속도</strong>

        <div class="speed-row">

            <span>느림</span>

            <input
                id="speed"
                type="range"
                min="0.5"
                max="1.5"
                step="0.1"
                value="1"
                oninput="updateSpeed()"
            >

            <span>빠름</span>

            <span id="speedValue">
                1.0x
            </span>

        </div>

    </div>


    <!-- 상태 -->

    <div
        class="status"
        id="status">

        텍스트를 입력하세요.

    </div>

</div>


<script>

    // 브라우저가 제공하는 음성 목록
    let voices = [];


    function getVoices() {

        voices = speechSynthesis.getVoices();

    }


    getVoices();

    speechSynthesis.onvoiceschanged = getVoices;


    // --------------------------------
    // 원하는 음성 찾기
    // --------------------------------

    function findVoice(language) {

        // 정확한 언어 찾기
        let voice = voices.find(function(v) {

            return v.lang.toLowerCase() ===
                   language.toLowerCase();

        });


        if (voice) {
            return voice;
        }


        // 같은 언어의 다른 음성 찾기
        let shortLanguage =
            language.split("-")[0].toLowerCase();


        voice = voices.find(function(v) {

            return v.lang
                .toLowerCase()
                .startsWith(shortLanguage);

        });


        return voice;
    }


    // --------------------------------
    // 텍스트 읽기
    // --------------------------------

    function readText(language) {

        const text =
            document.getElementById("text").value.trim();


        // 입력값 확인
        if (text === "") {

            alert("텍스트를 먼저 입력해주세요.");

            return;
        }


        // 현재 음성 중지
        speechSynthesis.cancel();


        // 음성 객체 생성
        const speech =
            new SpeechSynthesisUtterance(text);


        // 선택한 언어
        speech.lang = language;


        // 해당 언어 음성 찾기
        const voice = findVoice(language);


        if (voice) {

            speech.voice = voice;

        }


        // 말하기 속도
        speech.rate =
            Number(
                document.getElementById("speed").value
            );


        // 음높이
        speech.pitch = 1;


        // 볼륨
        speech.volume = 1;


        // --------------------------------
        // 재생 시작
        // --------------------------------

        speech.onstart = function() {

            if (language === "en-US") {

                document.getElementById("status")
                    .innerText =
                    "🇺🇸 American English 재생 중...";

            }

            else if (language === "en-GB") {

                document.getElementById("status")
                    .innerText =
                    "🇬🇧 British English 재생 중...";

            }

            else {

                document.getElementById("status")
                    .innerText =
                    "🇰🇷 한국어 재생 중...";

            }

        };


        // --------------------------------
        // 재생 완료
        // --------------------------------

        speech.onend = function() {

            document.getElementById("status")
                .innerText =
                "✅ 재생 완료";

        };


        // --------------------------------
        // 오류
        // --------------------------------

        speech.onerror = function() {

            document.getElementById("status")
                .innerText =
                "❌ 음성 재생 오류";

        };


        // 재생
        speechSynthesis.speak(speech);

    }


    // --------------------------------
    // 정지
    // --------------------------------

    function stopText() {

        speechSynthesis.cancel();

        document.getElementById("status")
            .innerText =
            "⏹ 재생 중지";

    }


    // --------------------------------
    // 텍스트 삭제
    // --------------------------------

    function clearText() {

        speechSynthesis.cancel();

        document.getElementById("text").value = "";

        document.getElementById("status")
            .innerText =
            "텍스트를 입력하세요.";

    }


    // --------------------------------
    // 속도 표시
    // --------------------------------

    function updateSpeed() {

        const speed =
            document.getElementById("speed").value;


        document.getElementById("speedValue")
            .innerText =
            speed + "x";

    }

</script>

</body>
</html>
