<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronunciation App</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 40px 20px;
        }

        .app {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .description {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 220px;
            box-sizing: border-box;
            padding: 15px;
            font-size: 18px;
            line-height: 1.6;
            border: 2px solid #ddd;
            border-radius: 12px;
            resize: vertical;
        }

        textarea:focus {
            outline: none;
            border-color: #4c8bf5;
        }

        .title {
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        button {
            padding: 15px 10px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.8;
        }

        .american {
            background: #e4efff;
            color: #1758b5;
        }

        .british {
            background: #eee7ff;
            color: #6236b5;
        }

        .korean {
            background: #e5f7ea;
            color: #198342;
        }

        .stop {
            background: #ffe5e5;
            color: #c62828;
        }

        .clear {
            background: #eeeeee;
            color: #555;
        }

        .bottom-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        .speed {
            margin-top: 25px;
        }

        .speed-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        #speed {
            flex: 1;
        }

        #speedValue {

            font-weight: bold;
        }

        .status {
            margin-top: 25px;
